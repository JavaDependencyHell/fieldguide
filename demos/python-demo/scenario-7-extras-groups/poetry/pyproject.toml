[project]
name = "p7-extras-groups"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["demo-lib-a==1.0.0"]

[tool.poetry]
package-mode = false

# tag::p7-poetry-group[]
# Poetry 2.2+ reads the standard PEP 735 table — the same one uv and
# pip read. Poetry installs every group by default; `--without dev`
# leaves it out. (Poetry's own [tool.poetry.group.dev] syntax still
# works, and is where `optional = true` lives if you want opt-in.)
[dependency-groups]
dev = ["demo-lib-d==1.0.0"]
# end::p7-poetry-group[]

[[tool.poetry.source]]
name = "demo-repo"
url = "http://127.0.0.1:8765/simple/"
priority = "primary"
