plugins {
    id 'java'
}

repositories {
    maven {
        url = uri("../../../target/local-repo")
    }
}

// tag::s13-deps[]
dependencies {
    // lib-a:1.0.0 is published twice: lib-a-1.0.0.jar and
    // lib-a-1.0.0-jdk11.jar (a Maven classifier). Without
    // Gradle Module Metadata there are no attribute-matched
    // variants, so we select the artifact explicitly:
    implementation 'com.demo:lib-a:1.0.0:jdk11'
}
// end::s13-deps[]

// Prints the jars on the runtime classpath (used by verify.sh)
tasks.register('printRuntimeJars') {
    def files = configurations.runtimeClasspath
    doLast { files.each { println "JAR " + it.name } }
}
