plugins {
    id 'java'
}

repositories {
    maven {
        url = uri("../../../target/local-repo")
    }
}

// tag::s14-deps[]
dependencies {
    implementation('com.demo:lib-a') {
        version {
            // 1.0.0 and 2.0.0 are both in the repository, so
            // this range would normally resolve to 2.0.0 ...
            require '[1.0.0, 3.0.0)'
            // ... unless we take 2.0.0 out of the candidate pool.
            reject '2.0.0'
        }
    }
}
// end::s14-deps[]
