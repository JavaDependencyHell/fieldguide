plugins {
    id 'java'
}

repositories {
    maven {
        url = uri("../../../target/local-repo")
        metadataSources {
            mavenPom()
            artifact()
        }
    }
}

// tag::s11-deps[]
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    // Fully dynamic version: "whatever is newest today".
    // The committed gradle.lockfile pins what it resolved
    // to when the lock was written.
    implementation 'com.demo:lib-a:+'
}
// end::s11-deps[]

// Generate or refresh the lock file:  gradle dependencies --write-locks
