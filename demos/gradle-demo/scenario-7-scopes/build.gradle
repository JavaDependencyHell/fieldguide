plugins {
    id 'java'
}

repositories {
    maven {
        url = uri("../../../target/local-repo")
    }
}

// tag::s7-deps[]
dependencies {
    // Needed to compile AND run (Maven: compile scope)
    implementation 'com.demo:lib-c:1.0.0'

    // Needed to compile, supplied by the runtime
    // environment (Maven: provided scope)
    compileOnly 'com.demo:lib-d:1.0.0'

    // Needed only by the tests (Maven: test scope).
    // lib-a transitively brings lib-b and lib-c.
    testImplementation 'com.demo:lib-a:1.0.0'
}
// end::s7-deps[]
