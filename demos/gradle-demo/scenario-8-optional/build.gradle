plugins {
    id 'java-library'
}

repositories {
    maven {
        url = uri("../../../target/local-repo")
    }
}

// tag::s8-deps[]
dependencies {
    // lib-d:1.0.0 declares lib-c:1.0.0 in its POM with
    // <optional>true</optional>. Gradle honours the flag:
    // lib-c is NOT added to our classpaths.
    implementation 'com.demo:lib-d:1.0.0'
}
// end::s8-deps[]

// tag::s8-feature[]
// How a Gradle *producer* expresses "optional": a feature
// variant with its own source set and dependencies. When
// published (with Gradle Module Metadata) consumers opt in
// via requireCapability(...); everyone else never sees lib-c.
sourceSets {
    create('reporting')
}

java {
    registerFeature('reporting') {
        usingSourceSet(sourceSets.reporting)
    }
}

dependencies {
    reportingImplementation 'com.demo:lib-c:1.0.0'
}
// end::s8-feature[]

// Prints the jars on the main runtime classpath (used by verify.sh)
tasks.register('printRuntimeJars') {
    def files = configurations.runtimeClasspath
    doLast { files.each { println "JAR " + it.name } }
}
